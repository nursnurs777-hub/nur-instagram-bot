services:
  - type: cron
    name: sfon-telegram-sync
    runtime: python
    plan: starter
    region: frankfurt
    repo: https://github.com/nursnurs777-hub/nur-instagram-bot
    branch: sfon-tg-sync
    schedule: "*/10 * * * *"
    buildCommand: pip install -r sfon-tg-sync/requirements.txt
    startCommand: python sfon-tg-sync/sync.py
    envVars:
      - key: SFON_API_KEY
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHANNEL
        value: "@nurelectronics01"
      - key: DRY_RUN
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: sfon-sync-db
          property: connectionString

databases:
  - name: sfon-sync-db
    plan: basic-256mb
    region: frankfurt
    diskSizeGB: 1
    postgresMajorVersion: "17"
    databaseName: sfon_sync_db
    user: sfon_sync_db_user
