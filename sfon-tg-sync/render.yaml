services:
  - type: cron
    name: sfon-telegram-sync
    runtime: python
    plan: starter
    region: frankfurt
    repo: https://github.com/nursnurs777-hub/nur-instagram-bot
    branch: sfon-tg-sync
    schedule: "*/10 * * * *"
    buildCommand: pip install -r sfon-tg-sync/requirements.txt
    startCommand: python sfon-tg-sync/sync.py
    envVars:
      - key: SFON_API_KEY
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHANNEL
        value: "@nurelectronics01"
      - key: WEBHOOK_BASE_URL
        value: https://nur-instagram-bot.onrender.com
      - key: WEBHOOK_KEY
        value: astana
      - key: DRY_RUN
        value: "0"
      - key: WHATSAPP_NUMBER
        value: "+77028881111"
      - key: NUR_DB_URL
        fromDatabase:
          name: nur-db
          property: connectionString

  - type: cron
    name: sfon-telegram-sync-shymkent
    runtime: python
    plan: starter
    region: frankfurt
    repo: https://github.com/nursnurs777-hub/nur-instagram-bot
    branch: sfon-tg-sync
    schedule: "*/10 * * * *"
    buildCommand: pip install -r sfon-tg-sync/requirements.txt
    startCommand: python sfon-tg-sync/sync.py
    envVars:
      - key: SFON_API_KEY
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHANNEL
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: DRY_RUN
        value: "0"
      - key: TABLE_NAME
        value: posts_shymkent
      - key: WEBHOOK_BASE_URL
        value: https://nur-instagram-bot.onrender.com
      - key: WEBHOOK_KEY
        value: shymkent
      - key: SHOW_YEAR
        value: "0"
      - key: NUR_DB_URL
        fromDatabase:
          name: nur-db
          property: connectionString

