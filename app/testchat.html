<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест бота · {{STORE_NAME}}</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    --bg:#f4f4f5; --panel:#ffffff; --ink:#18181b; --muted:#71717a; --line:#e4e4e7;
    --me:#2563eb; --me-ink:#fff; --bot:#f1f1f3; --mgr:#fef3c7; --mgr-ink:#78350f;
    --accent:#111827; --chip:#f4f4f5; --ok:#16a34a; --err:#dc2626;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0b0d; --panel:#141417; --ink:#f4f4f5; --muted:#a1a1aa; --line:#27272a;
      --bot:#1f1f23; --mgr:#3b2f12; --mgr-ink:#fde68a; --accent:#f4f4f5; --chip:#1f1f23; }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;justify-content:center}
  .app{width:100%;max-width:760px;height:100dvh;display:flex;flex-direction:column;background:var(--panel);
    border-left:1px solid var(--line);border-right:1px solid var(--line)}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--panel);display:grid;place-items:center;
    font-weight:700;letter-spacing:.5px;font-size:13px;flex:none}
  .title{flex:1;min-width:0}
  .title b{display:block;font-size:15px}
  .title span{color:var(--muted);font-size:12.5px}
  .hbtn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
  .hbtn:hover{background:var(--chip)}
  #status{font-size:12px;color:var(--muted);padding:6px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
  #status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:middle}
  #status .ok .dot{background:var(--ok)} #status .bad .dot{background:var(--err)}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:82%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
  .msg a{color:inherit}
  .me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:6px}
  .bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:6px}
  .mgr{align-self:flex-end;background:var(--mgr);color:var(--mgr-ink);border-bottom-right-radius:6px}
  .meta{font-size:11.5px;color:var(--muted);margin:-2px 4px 4px}
  .meta.r{align-self:flex-end} .meta.l{align-self:flex-start}
  .tag{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:2px 4px 0 0;font-size:11px}
  .sys{align-self:center;color:var(--muted);font-size:12.5px;text-align:center;max-width:90%}
  .err{color:var(--err)}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
  .thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,.4)}
  .typing{align-self:flex-start;background:var(--bot);border-radius:18px;padding:10px 14px}
  .typing i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  #card{margin:0 16px 8px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px;font-size:12.5px;color:var(--muted);display:none;white-space:pre-wrap}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 0;scrollbar-width:none}
  .chips button{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
  form{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;max-height:140px;min-height:42px;border:1px solid var(--line);border-radius:21px;padding:10px 14px;
    background:var(--panel);color:var(--ink);font:inherit;outline:none}
  textarea:focus{border-color:var(--muted)}
  .ibtn{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;
    display:grid;place-items:center;font-size:18px}
  .send{background:var(--me);color:#fff;border-color:var(--me)}
  .send:disabled{opacity:.5;cursor:default}
  #preview{display:flex;gap:6px;padding:0 16px;flex-wrap:wrap}
  #preview img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  label.mgrsw{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:6px 16px 0;cursor:pointer;user-select:none}
  .gate{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;padding:16px}
  .gate div{background:var(--panel);color:var(--ink);border-radius:14px;padding:20px;max-width:380px;width:100%}
  .gate input{width:100%;margin:10px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
  .gate p{color:var(--muted);font-size:13px;margin:6px 0 0}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">NUR</div>
    <div class="title"><b>{{STORE_NAME}} · тест бота</b><span>{{STORE_INSTAGRAM}} — без Instagram, ответы никуда не отправляются</span></div>
    <select class="hbtn" id="branch" title="Филиал" hidden></select>
    <button class="hbtn" id="reset" title="Начать новый диалог">Новый диалог</button>
  </header>
  <div id="status"><span id="st-cat"><i class="dot"></i>прайс…</span><span id="st-model"></span></div>
  <div id="log"></div>
  <div id="card"></div>
  <div class="chips" id="chips"></div>
  <label class="mgrsw"><input type="checkbox" id="asmgr"> написать как менеджер (проверить, что бот учитывает ответ сотрудника)</label>
  <div id="preview"></div>
  <form id="f">
    <input type="file" id="file" accept="image/*" multiple hidden>
    <button type="button" class="ibtn" id="attach" title="Прикрепить фото">📷</button>
    <textarea id="t" rows="1" placeholder="Сообщение как от клиента…"></textarea>
    <button class="ibtn send" id="send" title="Отправить">➤</button>
  </form>
</div>

<div class="gate" id="gate"><div>
  <b>Ключ доступа</b>
  <p>Вставьте значение ADMIN_TOKEN из Render → nur-instagram-bot → Environment. Ключ запомнится в этом браузере.</p>
  <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
  <button class="hbtn" id="tokok" style="width:100%">Войти</button>
</div></div>

<script>
const $ = s => document.querySelector(s);
const log = $('#log'), t = $('#t'), fileIn = $('#file'), preview = $('#preview'), card = $('#card');
const store = {
  get(k){ try { return localStorage.getItem(k) } catch(e){ return null } },
  set(k,v){ try { localStorage.setItem(k,v) } catch(e){} },
  del(k){ try { localStorage.removeItem(k) } catch(e){} },
};
let token = store.get('nur_admin_token') || '';
let session = store.get('nur_test_session') || newSession();
let files = [];
let busy = false;
let branch = store.get('nur_test_branch') || '';
const bsel = $('#branch');
bsel.onchange = () => { branch = bsel.value; store.set('nur_test_branch', branch); showCard(''); boot(); };

function newSession(){ const s = Date.now().toString(36) + Math.random().toString(36).slice(2,8); store.set('nur_test_session', s); return s; }
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function scroll(){ log.scrollTop = log.scrollHeight; }

function bubble(role, text, extra){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  if (extra && extra.thumbs && extra.thumbs.length){
    const th = document.createElement('div'); th.className = 'thumbs';
    extra.thumbs.forEach(u => { const i = new Image(); i.src = u; th.appendChild(i); });
    d.appendChild(th);
  }
  const span = document.createElement('span'); span.innerHTML = linkify(text || ''); d.appendChild(span);
  log.appendChild(d);
  if (extra && extra.meta){ const m = document.createElement('div'); m.className = 'meta ' + (role === 'bot' ? 'l' : 'r'); m.innerHTML = extra.meta; log.appendChild(m); }
  scroll();
}
function sys(text, cls){ const d = document.createElement('div'); d.className = 'sys ' + (cls||''); d.textContent = text; log.appendChild(d); scroll(); }
function showCard(c){ card.style.display = c ? 'block' : 'none'; card.textContent = c ? '🗂 Карточка диалога\n' + c : ''; }

async function api(path, opts={}){
  opts.headers = Object.assign({'X-Admin-Token': token}, opts.headers||{});
  const r = await fetch(path, opts);
  if (r.status === 401){ askToken(); throw new Error('Нужен ключ доступа'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ('Ошибка ' + r.status));
  return data;
}

function askToken(){ $('#gate').style.display = 'grid'; $('#tok').focus(); }
$('#tokok').onclick = () => { token = $('#tok').value.trim(); store.set('nur_admin_token', token); $('#gate').style.display = 'none'; boot(); };
$('#tok').addEventListener('keydown', e => { if (e.key === 'Enter') $('#tokok').click(); });

async function boot(){
  if (!token) return askToken();
  try {
    const bl = await api('/test/api/branches');
    if (!bl.some(b => b.key === branch)) branch = (bl.find(b => b.primary) || bl[0]).key;
    bsel.innerHTML = bl.map(b => `<option value="${esc(b.key)}">${esc(b.city)} · ${esc(b.instagram)}</option>`).join('');
    bsel.value = branch; bsel.hidden = bl.length < 2;
  } catch(e){}
  try {
    const c = await api('/test/api/catalog?branch=' + encodeURIComponent(branch));
    $('#st-cat').className = 'ok'; $('#st-cat').innerHTML = `<i class="dot"></i>прайс: ${c.products} товаров, Trade-in: ${c.tradein}`;
    $('#st-model').textContent = 'модель: ' + c.model;
  } catch(e){ $('#st-cat').className = 'bad'; $('#st-cat').innerHTML = '<i class="dot"></i>' + esc(e.message); return; }
  log.innerHTML = '';
  try {
    const h = await api('/test/api/history?session=' + encodeURIComponent(session) + '&branch=' + encodeURIComponent(branch));
    if (!h.messages.length) sys('Напишите сообщение так, как написал бы клиент в директ. Можно прикрепить фото.');
    h.messages.forEach(m => bubble(m.role === 'user' ? 'me' : m.role === 'manager' ? 'mgr' : 'bot', m.content,
                       m.role === 'manager' ? {meta:'менеджер'} : null));
    showCard(h.card);
  } catch(e){ sys(e.message, 'err'); }
}

const examples = ['Здравствуйте', 'Сколько стоит iPhone 17 Pro?', 'Хочу сдать iPhone 15 Pro 256 по трейд-ин, батарея 82%, коробка есть, есть мелкие царапины',
  'А если обменять на 18 Pro Max?', 'Можно в рассрочку?', 'Есть PS5? Хочу приехать', 'Сәлеметсіз бе, MacBook Air бағасы қанша?', 'Do you have AirPods Pro 3?'];
examples.forEach(x => { const b = document.createElement('button'); b.type = 'button'; b.textContent = x;
  b.onclick = () => { t.value = x; t.focus(); autosize(); }; $('#chips').appendChild(b); });

function autosize(){ t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
t.addEventListener('input', autosize);
t.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('#f').requestSubmit(); } });

$('#attach').onclick = () => fileIn.click();
fileIn.onchange = () => { files = files.concat([...fileIn.files]).slice(0, 4); fileIn.value = ''; renderPreview(); };
function renderPreview(){ preview.innerHTML = ''; files.forEach((f, i) => { const im = new Image(); im.src = URL.createObjectURL(f); im.title = 'Убрать';
  im.onclick = () => { files.splice(i,1); renderPreview(); }; preview.appendChild(im); }); }

$('#reset').onclick = async () => {
  if (!confirm('Начать новый диалог? Текущий тестовый диалог будет удалён.')) return;
  try { await api('/test/api/reset', {method:'POST', body: new URLSearchParams({session, branch})}); } catch(e){}
  session = newSession(); showCard(''); boot();
};

$('#f').onsubmit = async e => {
  e.preventDefault();
  if (busy) return;
  const text = t.value.trim(), asMgr = $('#asmgr').checked;
  if (!text && !files.length) return;
  busy = true; $('#send').disabled = true;
  const thumbs = files.map(f => URL.createObjectURL(f));
  bubble(asMgr ? 'mgr' : 'me', text, {thumbs, meta: asMgr ? 'менеджер' : ''});
  const fd = new FormData(); fd.append('session', session); fd.append('text', text); fd.append('as_manager', asMgr ? 'true' : 'false'); fd.append('branch', branch);
  files.forEach(f => fd.append('files', f));
  t.value = ''; files = []; renderPreview(); autosize();
  let typing;
  if (!asMgr){ typing = document.createElement('div'); typing.className = 'typing'; typing.innerHTML = '<i></i><i></i><i></i>'; log.appendChild(typing); scroll(); }
  const started = performance.now();
  try {
    const r = await api('/test/api/message', {method:'POST', body: fd});
    if (typing) typing.remove();
    if (r.note) sys(r.note);
    if (r.photo_notes && r.photo_notes.length) sys('Сохранено вместо фото: ' + r.photo_notes.join(' '));
    if (r.reply){
      const secs = ((performance.now() - started)/1000).toFixed(1);
      const tags = (r.tools||[]).map(x => `<span class="tag">${esc(x)}</span>`).join('');
      bubble('bot', r.reply, {meta: `${secs} с ${tags}`});
      (r.media || []).forEach(m => bubble('bot', '📷 ' + (m.label || 'фото'), {thumbs: m.urls}));
    } else if (!asMgr) sys('Бот ничего не ответил', 'err');
    showCard(r.card);
  } catch(err){ if (typing) typing.remove(); sys(err.message, 'err'); }
  busy = false; $('#send').disabled = false; t.focus();
};

boot();
</script>
</body>
</html>
